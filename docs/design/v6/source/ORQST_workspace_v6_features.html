</style></head><body><div class="app"><aside class="sidebar"><div class="brand">ORQST <span>✦</span></div><div class="sideheading">WORKSPACES</div><div id="workspaceList"></div><div class="nav" id="newWorkspace">＋ Novo Workspace</div><div class="sideheading">FEATURES <span style="float:right;color:#ad8af5" id="newFeature" title="Criar Feature">＋</span></div><div id="featureList"></div><div class="nav" id="featureCreate">＋ Nova Feature</div><div class="sidefoot">● CORE ONLINE<br><br>Prévia visual · CLIs simulados</div></aside><main class="main"><header class="top"><div><strong>◈ &nbsp; <span id="crumb">ORQST / Autenticação</span></strong> <span class="sub">&nbsp; · &nbsp; Agent workspace</span></div><div class="controls"><button class="btn" id="layout">▦ Grade</button><button class="btn" id="restore">↺ Restaurar</button><button class="btn" id="delegate">↗ Delegar</button><button class="btn primary" id="add">＋ Terminal</button></div></header><div class="workspace" id="workspace"><div class="dockgrid" id="dockgrid"><div class="slot" data-slot="0" style="grid-column:1;grid-row:1"></div><div class="slot" data-slot="1" style="grid-column:3;grid-row:1"></div><div class="slot" data-slot="2" style="grid-column:1;grid-row:3"></div><div class="slot" data-slot="3" style="grid-column:3;grid-row:3"></div><div class="divider vertical" id="vdiv"></div><div class="divider horizontal" id="hdiv"></div></div><svg id="flow" class="flow" aria-hidden="true"></svg></div><footer class="bottom" id="bottom"><span class="label">MINIMIZADOS</span><span class="event" id="event">● 4 sessões · comunicação em espera</span></footer></main></div><div id="menu" class="menu"></div><dialog id="dialog"><form method="dialog"><h3 id="dialogTitle">Terminal</h3><label>Nome<input id="fieldName" required></label><label>Alias para menções @<input id="fieldAlias" pattern="[a-zA-Z0-9_-]+" required></label><label>CLI<select id="fieldCli"><option>Codex</option><option>Claude Code</option><option>OpenCode</option><o function menu(id,anchor){const a=aget(id),m=$('menu'),r=anchor.getBoundingClientRect();m.innerHTML=`<button data-action="edit">⚙ Configurações / renomear</button><button data-action="role">★ ${a.role?'Remover':'Definir'} orquestrador</button><button data-action="float">▢ ${a.float?'Encaixar na grade':'Tornar flutuante'}</button><button data-action="min">− Minimizar</button><button data-action="max">□ Maximizar / restaurar</button><button data-action="duplicate">▣ Duplicar configuração</button>`;m.style.left=Math.max(4,Math.min(innerWidth-222,r.left-170))+'px';m.style.top=Math.max(4,Math.min(innerHeight-270,r.bottom+4))+'px';m.classList.add('show');m.querySelectorAll('button').forEach(b=>b.onclick=()=>{m.classList.remove('show');switch(b.dataset.action){case'edit':openEditor(id);break;case'role':agents.forEach(x=>x.role=x.id===id);render();break;case'float':a.float=!a.float;a.max=false;render();break;case'min':a.min=true;render();break;case'max':maximize(id);break;case'duplicate':agents.push({...a,id:next++,name:a.name+' 2',alias:a.alias+'2',role:false,slot:agents.findIndex(x=>x.slot===0&&x.closed)?0:3,float:true,fx:20,fy:20,max:false,min:false,closed:false,lines:[...a.lines]});render();break}})}

function dragFloat(pane,a){const head=pane.querySelector('.panehead');head.draggable=false;head.onpointerdown=e=>{if(e.target.closest('button'))return;const sx=e.clientX,sy=e.clientY,rect=pane.getBoundingClientRect(),wr=$('workspace').getBoundingClientRect();head.setPointerCapture(e.pointerId);function move(ev){const x=Math.max(0,Math.min(wr.width-rect.width,rect.left-wr.left+ev.clientX-sx)),y=Math.max(0,Math.min(wr.height-rect.height,rect.top-wr.top+ev.clientY-sy));pane.style.left=x+'px';pane.style.top=y+'px'}function stop(){a.fx=100*parseFloat(pane.style.left)/wr.width;a.fy=100*parseFloat(pane.style.top)/wr.height;head.removeEventListener('pointermove',move);head.removeEventListener('pointerup',stop)}head.addEventListener('pointermove',move);head.addEventListener('pointerup',stop,{once:true})}}

]}, {id:'website',name:'Website',features:[{id:'landing',name:'Landing Page',description:'Site institucional',status:'active',agents:[],layout:'grid'}]}];
let selectedWorkspace='orqst',selectedFeature='auth';
function currentWorkspace(){return workspaces.find(w=>w.id===selectedWorkspace)}
function currentFeature(){return currentWorkspace()?.features.find(f=>f.id===selectedFeature)}
function persistPreview(){const f=currentFeature();if(f){f.agents=JSON.parse(JSON.stringify(agents));f.layout=layout}try{localStorage.setItem('orqst-v5-features-preview',JSON.stringify({workspaces,selectedWorkspace,selectedFeature,next}))}catch{}}
function renderFeatureSidebar(){const ws=$('workspaceList'),fl=$('featureList');if(!ws||!fl)return;ws.innerHTML='';for(const w of workspaces){const el=document.createElement('div');el.className='nav'+(w.id===selectedWorkspace?' active':'');el.innerHTML=`▣ &nbsp; ${esc(w.name)} <span>${w.features.length}</span>`;el.onclick=()=>switchWorkspace(w.id);ws.append(el)}fl.innerHTML='';for(const f of currentWorkspace()?.features||[]){const el=document.createElement('div');el.className='nav'+(f.id===selectedFeature?' active':'');const count=f.id===selectedFeature?agents.filter(a=>!a.closed).length:f.agents.filter(a=>!a.closed).length;el.innerHTML=`◇ &nbsp; ${esc(f.name)} <span>${count}</span>`;el.title=f.description||'';el.onclick=()=>switchFeature(f.id);fl.append(el)}const f=currentFeature();$('crumb').textContent=(currentWorkspace()?.name||'Workspace')+' / '+(f?.name||'Feature');$('event').textContent=`● ${agents.filter(a=>!a.closed).length} terminais · ${f?.name||''} · prévia simulada`}
function switchWorkspace(id){if(selectedWorkspace===id)return;persistPreview();selectedWorkspace=id;selectedFeature=workspaces.find(w=>w.id===id)?.features[0]?.id||'';loadFeature()}
function switchFeature(id){if(selectedFeature===id)return;persistPreview();selectedFeature=id;loadFeature()}
function loadFeature(){const f=currentFeature();agents.splice(0,agents.length,...JSON.parse(JSON.stringify(f?.agents||[])));maxId=null;layout='grid';resetGrid();render();toast('Feature '+(f?.name||'')+' selecionada; sessões apenas simuladas')}
function createFeature(){const name=prompt('Nome da nova Feature:','Nova Feature');if(!name?.trim())return;const desc=prompt('Descrição (opcional):','')||'';persistPreview();const f={id:'feature-'+Date.now(),name:name.trim(),description:desc,status:'planned',agents:[],layout:'grid'};currentWorkspace().features.push(f);selectedFeature=f.id;loadFeature();persistPreview()}
function createWorkspace(){const name=prompt('Nome do Workspace:','Novo projeto');if(!name?.trim())return;persistPreview();const w={id:'workspace-'+Date.now(),name:name.trim(),features:[{id:'feature-'+Date.now(),name:'Geral',description:'',status:'active',agents:[],layout:'grid'}]};workspaces.push(w);selectedWorkspace=w.id;selectedFeature=w.features[0].id;loadFeature();persistPreview()}
$('newFeature').onclick=createFeature;$('featureCreate').onclick=createFeature;$('newWorkspace').onclick=createWorkspace;
try{const raw=localStorage.getItem('orqst-v5-features-preview');if(raw){const data=JSON.parse(raw);if(Array.isArray(data.workspaces)&&data.workspaces.length){workspaces=data.workspaces;selectedWorkspace=data.selectedWorkspace;selectedFeature=data.selectedFeature;next=Math.max(next,Number(data.next)||0);const f=currentFeature();if(f)agents.splice(0,agents.length,...JSON.parse(JSON.stringify(f.agents)))}}}catch{}
const originalRender=render;render=function(){originalRender();persistPreview()};
render();
